# .github/workflows/security.yml
# J1 security gate: runs on every PR into main (D2).
#   gitleaks     -> secrets in code or git history (R11)
#   npm-audit    -> vulnerable Angular dependencies (R12, R13)
#   dotnet-audit -> vulnerable NuGet packages, incl. transitive (R12, R13)
# Later: Semgrep for code patterns.

name: security

on:
  pull_request:
    branches: [main]
  # Never use pull_request_target here: it runs with write access on PR code.

# Least privilege: every job only needs to read the code.
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        # Pinned to a commit SHA, not a tag: a tag can be moved, a SHA can't. Dependabot keeps it updated.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # gitleaks needs the whole history, not just the last commit

      - name: Install gitleaks (pinned version + checksum check)
        env:
          # https://github.com/gitleaks/gitleaks/releases (without the "v")
          GITLEAKS_VERSION: "8.30.1"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl -sSfLO "${base}/${file}"
          curl -sSfLO "${base}/${sums}"
          # Supply-chain check: refuse to run a binary whose hash doesn't match the release checksum
          grep " ${file}\$" "${sums}" | sha256sum -c -
          tar -xzf "${file}" gitleaks

      - name: Scan full git history for secrets
        # --redact: never print the secret itself in the (public) CI log
        run: ./gitleaks git --redact --verbose .

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ehb-connect.client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: npm audit (fail on high/critical, shipped dependencies only)
        # Reads package-lock.json; no install needed.
        # --omit=dev: dev tooling doesn't ship to users, so it doesn't block merges.
        run: npm audit --omit=dev --audit-level=high

  dotnet-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same SDK as ci.yml
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        # The API project only; the .slnx also contains the Angular .esproj
        run: dotnet restore ehb-connect.Server/ehb-connect.Server.csproj

      - name: Vulnerable NuGet packages (incl. transitive)
        # 'dotnet list package --vulnerable' exits 0 even when it finds something,
        # so we fail the job ourselves when the report is not empty.
        run: |
          dotnet list ehb-connect.Server/ehb-connect.Server.csproj package --vulnerable --include-transitive | tee audit.txt
          if grep -q "has the following vulnerable packages" audit.txt; then
            echo "::error::Vulnerable NuGet packages found (see log above)"
            exit 1
          fi