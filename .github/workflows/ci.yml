# CI: builds the app and runs the tests on every pull request into main.
# Both jobs must pass before a PR can be merged (once they're required checks
# in the "Protect Main" ruleset).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

# A new push to the same PR cancels the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Angular build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ehb-connect.client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: ehb-connect.client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npx ng build

      - name: Unit tests (headless Chrome)
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI

  backend:
    name: Backend (.NET build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Builds only the API. BuildProjectReferences=false skips the Angular
      # project reference, which the frontend job already builds.
      - name: Build
        run: dotnet build ehb-connect.Server/ehb-connect.Server.csproj -c Release -p:BuildProjectReferences=false

      # Add when the first .NET test project exists:
      # - name: Tests
      #   run: dotnet test -c Release
