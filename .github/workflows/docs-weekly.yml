# .github/workflows/docs-weekly.yml
# J2: every Monday, turn last week's merged PRs into a worklog entry + weekly report,
# and open them as a PR for Tom to complete (Risks & blockers) and merge.

name: docs-weekly

on:
  schedule:
    - cron: "0 6 * * 1"          # Mondays 06:00 UTC (07:00 Brussels, winter time)
  workflow_dispatch:              # manual run, e.g. for a sprint report
    inputs:
      since:
        description: "Start date YYYY-MM-DD (empty = last week)"
        required: false
        default: ""
      until:
        description: "End date YYYY-MM-DD (empty = last week)"
        required: false
        default: ""

# GITHUB_TOKEN stays read-only. Writing happens with DOCS_BOT_TOKEN, because a PR
# opened with GITHUB_TOKEN would not trigger J1, and branch protection would block it.
permissions:
  contents: read

concurrency:
  group: docs-weekly
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, bot token for pushing)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.DOCS_BOT_TOKEN }}

      - name: Generate worklog + weekly report
        id: report
        env:
          GH_TOKEN: ${{ secrets.DOCS_BOT_TOKEN }}
          # Inputs go in via env, never pasted into the script (avoids script injection).
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
        run: node .github/scripts/weekly-report.js

      - name: Commit to a branch and open a PR
        env:
          GH_TOKEN: ${{ secrets.DOCS_BOT_TOKEN }}
          LABEL: ${{ steps.report.outputs.label }}
          SINCE: ${{ steps.report.outputs.since }}
          UNTIL: ${{ steps.report.outputs.until }}
        run: |
          branch="docs/auto-${LABEL}"
          git config user.name "docs-bot"
          git config user.email "docs-bot@users.noreply.github.com"
          git switch -C "$branch"
          git add docs/worklog.md "docs/reports/${LABEL}.md"
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "docs: weekly worklog and report ${LABEL}"
          git push --force origin "$branch"     # dedicated bot branch, safe to overwrite on re-runs
          if gh pr view "$branch" --json number > /dev/null 2>&1; then
            echo "PR already exists; branch updated."
          else
            gh pr create --base main --head "$branch" \
              --title "docs: weekly report ${LABEL}" \
              --body "Generated by J2 for ${SINCE} to ${UNTIL}. Fill in **Risks & blockers**, review, merge."
          fi
