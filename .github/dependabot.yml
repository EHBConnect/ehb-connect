# .github/dependabot.yml
# Dependency update PRs + security alerts for every ecosystem in the repo.
# Grouped, so we get a few PRs a week instead of one per package.
# Security updates for known vulnerabilities still arrive as separate PRs: those go first.
# Remediation timeframes for these updates are documented under ASVS 15.1.1.

version: 2
updates:
  # GitHub Actions in security.yml, ci.yml and docs-weekly.yml: one PR for all of them
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  # Angular front end
  - package-ecosystem: "npm"
    directory: "/ehb-connect.client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Angular packages must always move together, to the same version
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "zone.js", "rxjs", "typescript"]
      # Everything else: minor and patch updates in one PR
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  # ASP.NET Core back end
  - package-ecosystem: "nuget"
    directory: "/ehb-connect.Server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dotnet-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # We target .NET 10 (CI uses 10.0.x). Major versions (11.x) are a team decision, not an automatic update.
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]